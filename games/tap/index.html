<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タップ・ドット</title>
<style>
  :root {
    --paper: #f6f1e7;
    --ink: #1d1d1b;
    --red: #e5322d;
    --pink: #ff4fa3;
    --blue: #0a6cff;
    --yellow: #ffd23f;
    --green: #2f5f50;
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 2px solid var(--ink);
    min-width: 0;
  }
  .bar h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .bar h1 span { color: var(--pink); }
  .stats {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 14px;
    white-space: nowrap;
  }
  .stats b { font-weight: 700; }
  .stats .label { font-family: var(--sans); font-size: 11px; letter-spacing: 0.06em; margin-right: 4px; }
  .lives { display: flex; gap: 4px; align-items: center; }
  .lives i {
    display: block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: var(--red);
  }
  .lives i.off { background: transparent; }
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(246, 241, 231, 0.86);
  }
  .overlay[hidden] { display: none; }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    padding: clamp(16px, 4vmin, 28px) clamp(14px, 4vmin, 28px);
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: clamp(26px, 7vmin, 44px);
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-shadow: 3px 3px 0 var(--blue);
  }
  .card p {
    margin: 0 0 16px;
    font-size: clamp(13px, 2.4vmin, 15px);
    line-height: 1.7;
  }
  .card .score {
    font-family: var(--mono);
    font-size: clamp(30px, 8vmin, 48px);
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .card .sub { font-size: 13px; margin-bottom: 16px; }
  .card .new { color: var(--red); font-weight: 800; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: 0 0 14px; }
  .dots i {
    display: block; width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--ink);
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 0;
    padding: 10px 28px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  button:hover { background: #ffdc66; }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
  @media (max-width: 360px) {
    .bar { padding: 6px 10px; }
    .stats { gap: 10px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>TAP DOT<span>.</span></h1>
    <div class="stats">
      <div class="lives" id="lives" aria-label="残り"><i></i><i></i><i></i></div>
      <div><span class="label">スコア</span><b id="score">0</b></div>
      <div><span class="label">ベスト</span><b id="best">0</b></div>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="タップ・ドットのゲーム画面"></canvas>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h2>タップ・ドット</h2>
        <div class="dots" aria-hidden="true">
          <i style="background:#ff4fa3"></i><i style="background:#0a6cff"></i><i style="background:#ffd23f"></i>
        </div>
        <p id="howto">縮んで消える前に丸をタップ・押して得点。3つ見逃したら終わり。</p>
        <button type="button" id="startBtn">スタート</button>
      </div>
    </div>

    <div class="overlay" id="overScreen" hidden>
      <div class="card" role="status">
        <h2>ゲームオーバー</h2>
        <div class="score" id="finalScore">0</div>
        <div class="sub" id="finalSub">ベスト 0</div>
        <button type="button" id="restartBtn">もう一度</button>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var C = {
    paper: "#f6f1e7", ink: "#1d1d1b", red: "#e5322d", pink: "#ff4fa3",
    blue: "#0a6cff", yellow: "#ffd23f", green: "#2f5f50"
  };
  var DOT_COLORS = [C.pink, C.blue, C.yellow];
  var BEST_KEY = "portfolio-tapdot-best";
  var MAX_MISSES = 3;
  var MIN_HIT_R = 22;

  var stage = document.getElementById("stage");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var livesEl = document.getElementById("lives");
  var startScreen = document.getElementById("startScreen");
  var overScreen = document.getElementById("overScreen");
  var startBtn = document.getElementById("startBtn");
  var restartBtn = document.getElementById("restartBtn");
  var finalScore = document.getElementById("finalScore");
  var finalSub = document.getElementById("finalSub");

  var reduceMotion = false;
  try {
    var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    reduceMotion = mq.matches;
    var onMq = function (e) { reduceMotion = e.matches; };
    if (mq.addEventListener) mq.addEventListener("change", onMq);
    else if (mq.addListener) mq.addListener(onMq);
  } catch (e) { /* ignore */ }

  function loadBest() {
    try {
      var v = parseInt(window.localStorage.getItem(BEST_KEY), 10);
      return isFinite(v) && v > 0 ? v : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* ignore */ }
  }

  var W = 0, H = 0, dpr = 1;
  var state = "start"; // start | playing | over
  var dots = [], effects = [];
  var score = 0, misses = 0, best = loadBest();
  var clock = 0, nextSpawn = 0, colorIdx = 0, lastT = 0;

  bestEl.textContent = best;

  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, Math.floor(r.width));
    H = Math.max(1, Math.floor(r.height));
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // keep existing dots inside the new bounds
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.x = Math.min(Math.max(d.x, d.r0), Math.max(d.r0, W - d.r0));
      d.y = Math.min(Math.max(d.y, d.r0), Math.max(d.r0, H - d.r0));
    }
    draw();
  }

  function baseRadius() {
    return Math.max(26, Math.min(46, Math.min(W, H) * 0.075));
  }
  // difficulty ramps with score
  function lifetime() { return Math.max(1150, 1600 - score * 12); }
  function spawnGap() { return Math.max(360, 950 - score * 18); }

  function spawn() {
    var r0 = baseRadius();
    var m = r0 + 6;
    var x = W / 2, y = H / 2;
    for (var tries = 0; tries < 16; tries++) {
      x = m + Math.random() * Math.max(1, W - m * 2);
      y = m + Math.random() * Math.max(1, H - m * 2);
      var ok = true;
      for (var i = 0; i < dots.length; i++) {
        var dx = dots[i].x - x, dy = dots[i].y - y;
        if (dx * dx + dy * dy < Math.pow(r0 + dots[i].r0 + 6, 2)) { ok = false; break; }
      }
      if (ok) break;
    }
    dots.push({
      x: x, y: y, r0: r0, born: clock, life: lifetime(),
      color: DOT_COLORS[colorIdx++ % DOT_COLORS.length]
    });
  }

  function radiusOf(d) {
    var k = 1 - (clock - d.born) / d.life;
    // quick grow-in for the first 90ms, then linear shrink
    var grow = Math.min(1, (clock - d.born) / 90);
    return Math.max(0, d.r0 * k * (reduceMotion ? 1 : 0.6 + 0.4 * grow));
  }

  function renderLives() {
    var items = livesEl.children;
    for (var i = 0; i < items.length; i++) {
      items[i].className = i < MAX_MISSES - misses ? "" : "off";
    }
    livesEl.setAttribute("aria-label", "残り " + (MAX_MISSES - misses));
  }

  function start() {
    if (state === "playing") return;
    dots = [];
    effects = [];
    score = 0;
    misses = 0;
    clock = 0;
    nextSpawn = 250;
    colorIdx = Math.floor(Math.random() * 3);
    scoreEl.textContent = "0";
    renderLives();
    startScreen.hidden = true;
    overScreen.hidden = true;
    state = "playing";
    lastT = performance.now();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function gameOver() {
    state = "over";
    var isNew = score > best;
    if (isNew) { best = score; saveBest(best); bestEl.textContent = best; }
    finalScore.textContent = score;
    finalSub.innerHTML = isNew && score > 0 ? '<span class="new">ベスト更新!</span>' : "ベスト " + best;
    // brief beat so the last miss is visible before the card appears
    setTimeout(function () {
      if (state !== "over") return;
      overScreen.hidden = false;
      restartBtn.focus({ preventScroll: true });
    }, 450);
  }

  function hit(px, py) {
    var bestIdx = -1, bestDist = Infinity;
    for (var i = dots.length - 1; i >= 0; i--) {
      var d = dots[i];
      var r = Math.max(MIN_HIT_R, radiusOf(d) + 6);
      var dx = px - d.x, dy = py - d.y;
      var dist = dx * dx + dy * dy;
      if (dist <= r * r && dist < bestDist) { bestDist = dist; bestIdx = i; }
    }
    if (bestIdx < 0) return;
    var d2 = dots[bestIdx];
    var rNow = radiusOf(d2);
    dots.splice(bestIdx, 1);
    // bonus point for a fast tap (still more than 60% of its size)
    var pts = rNow / d2.r0 > 0.6 ? 2 : 1;
    score += pts;
    scoreEl.textContent = score;
    if (score > best) bestEl.textContent = score;
    effects.push({ kind: "pop", x: d2.x, y: d2.y, r: Math.max(rNow, 10), color: d2.color, t: 0, text: "+" + pts });
  }

  function miss(d) {
    misses++;
    renderLives();
    effects.push({ kind: "miss", x: d.x, y: d.y, r: d.r0 * 0.45, t: 0 });
    if (misses >= MAX_MISSES) gameOver();
  }

  function update(dt) {
    for (var e = effects.length - 1; e >= 0; e--) {
      effects[e].t += dt / (effects[e].kind === "pop" ? 420 : 700);
      if (effects[e].t >= 1) effects.splice(e, 1);
    }
    if (state !== "playing") return;
    clock += dt;
    if (clock >= nextSpawn) {
      spawn();
      // occasionally a second dot at once once things heat up
      if (score > 25 && Math.random() < 0.25) spawn();
      nextSpawn = clock + spawnGap() * (0.75 + Math.random() * 0.5);
    }
    for (var i = dots.length - 1; i >= 0; i--) {
      if (clock - dots[i].born >= dots[i].life) {
        var d = dots[i];
        dots.splice(i, 1);
        miss(d);
        if (state !== "playing") break;
      }
    }
  }

  function draw() {
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, W, H);

    // dots
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var r = radiusOf(d);
      if (r <= 0.5) continue;
      // faint "plate" showing the original size
      ctx.strokeStyle = "rgba(29,29,27,0.14)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      // fill + thin ink outline
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // effects
    for (var j = 0; j < effects.length; j++) {
      var ef = effects[j];
      var a = Math.max(0, 1 - ef.t);
      if (ef.kind === "pop") {
        if (reduceMotion) {
          ctx.globalAlpha = a;
          ctx.strokeStyle = ef.color;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(ef.x, ef.y, ef.r + 4, 0, Math.PI * 2); ctx.stroke();
        } else {
          var ease = 1 - Math.pow(1 - ef.t, 3);
          ctx.globalAlpha = a;
          ctx.strokeStyle = ef.color;
          ctx.lineWidth = 4 * a + 1;
          ctx.beginPath(); ctx.arc(ef.x, ef.y, ef.r + ease * 26, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = C.ink;
          ctx.lineWidth = 1.5;
          for (var k = 0; k < 8; k++) {
            var ang = (Math.PI * 2 * k) / 8 + 0.3;
            var r1 = ef.r + 6 + ease * 18, r2 = r1 + 7;
            ctx.beginPath();
            ctx.moveTo(ef.x + Math.cos(ang) * r1, ef.y + Math.sin(ang) * r1);
            ctx.lineTo(ef.x + Math.cos(ang) * r2, ef.y + Math.sin(ang) * r2);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = a;
        ctx.fillStyle = C.ink;
        ctx.font = "700 16px " + 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ef.text, ef.x, ef.y - (reduceMotion ? 0 : ef.t * 16));
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = a;
        ctx.strokeStyle = C.red;
        ctx.lineWidth = 3;
        var s = Math.max(8, ef.r);
        ctx.beginPath();
        ctx.moveTo(ef.x - s, ef.y - s); ctx.lineTo(ef.x + s, ef.y + s);
        ctx.moveTo(ef.x + s, ef.y - s); ctx.lineTo(ef.x - s, ef.y + s);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function loop(t) {
    var dt = Math.min(50, Math.max(0, t - lastT));
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---- input ----
  cv.addEventListener("pointerdown", function (e) {
    if (state !== "playing") return;
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    hit(e.clientX - r.left, e.clientY - r.top);
  });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  startBtn.addEventListener("click", start);
  restartBtn.addEventListener("click", start);

  window.addEventListener("keydown", function (e) {
    if ((e.key === " " || e.key === "Enter") && state !== "playing") {
      // the focused button handles activation itself; only act when nothing is focused
      if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
      if (state === "start" || !overScreen.hidden) { e.preventDefault(); start(); }
    } else if (e.key === " ") {
      e.preventDefault();
    }
  });

  window.addEventListener("resize", resize);
  if (typeof ResizeObserver === "function") new ResizeObserver(resize).observe(stage);

  resize();
  lastT = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
