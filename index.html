<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LUO JIAWEN ポートフォリオ｜UI/UX・イラスト・Web制作</title>
<meta name="description" content="UI/UXデザイン、イラスト、グラフィック、Web制作を手がける罗嘉雯（ルオ ジアウェン）のポートフォリオ。デザインから実装まで、自分の手でつくっています。">
<meta name="theme-color" content="#4a7a74">

<!-- SNS でシェアされたときの表示（OGP） -->
<meta property="og:type" content="website">
<meta property="og:title" content="LUO JIAWEN ポートフォリオ｜UI/UX・イラスト・Web制作">
<meta property="og:description" content="レトロなパソコンのデスクトップに、作品を並べました。UI/UX・イラスト・グラフィック・Web制作・Webゲームのポートフォリオ。">
<!-- ※ 公開URLが変わったら、下の2行のURLも変えてください -->
<meta property="og:url" content="https://huu69769.github.io/portfolio/">
<meta property="og:image" content="https://huu69769.github.io/portfolio/assets/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect x='4' y='4' width='24' height='17' fill='%23d8d4cb' stroke='%23333' stroke-width='1.4'/%3E%3Crect x='7' y='7' width='18' height='11' fill='%234a7a74'/%3E%3Crect x='6' y='24' width='20' height='4' fill='%23d8d4cb' stroke='%23333'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 起動画面（押すとスキップ） -->
<div id="boot" aria-hidden="true">
  <div id="bootLines"></div>
  <span class="boot-skip">押すとスキップ</span>
</div>

<main id="desk" class="desktop">
  <!-- 壁紙の大きな名前（飾り・読み上げ対象外） -->
  <div class="wallpaper-name" aria-hidden="true">LUO<br>JIAWEN</div>

  <!-- 自己紹介。「ようこそ.exe」ウィンドウの中身になります -->
  <div id="hero" class="hello">
    <p class="hello-small">はじめまして</p>
    <h1 class="hello-big">
      <span>HELLO</span> <span>MY NAME IS</span> <span>LUO JIAWEN<span class="cursor" aria-hidden="true"></span></span>
    </h1>
    <ul class="fields" aria-label="制作領域">
      <li><button class="field" data-open="uiux"><b>UI/UX</b><span>システム設計</span></button></li>
      <li><button class="field" data-open="illust"><b>Illustration</b><span>イラスト制作</span></button></li>
      <li><button class="field" data-open="univ"><b>Graphic</b><span>大学時代の作品</span></button></li>
    </ul>
    <div class="row">
      <button class="btn btn-main" data-open="works">作品を見る</button>
      <button class="btn" data-open="contact">お問い合わせ</button>
    </div>
    <p class="hint">アイコンを選ぶと、作品が開きます。</p>
  </div>

  <!-- デスクトップのアイコン（中身は assets/js/data.js の DESK から作られます） -->
  <div id="entries" class="icons" aria-label="作品と情報"></div>
</main>

<!-- スタートメニュー -->
<div id="startMenu" class="out" hidden>
  <div class="sm-banner" aria-hidden="true">LUO JIAWEN portfolio</div>
  <div class="sm-list" id="smList" role="menu" aria-label="スタートメニュー"></div>
</div>

<!-- タスクバー（ナビ ＋ 開いているウィンドウの一覧） -->
<nav class="taskbar out" aria-label="メインナビゲーション">
  <button class="btn start d-only" id="startBtn" aria-haspopup="true" aria-expanded="false" aria-controls="startMenu"></button>
  <button class="btn tbtn m-only" id="mBack" disabled><span class="tb-ico" aria-hidden="true">◀</span><span>もどる</span></button>
  <button class="btn tbtn m-only" id="mHome"><span class="tb-ico" aria-hidden="true">⌂</span><span>ホーム</span></button>
  <span class="quick" id="quick">
    <button class="btn tbtn" data-open="works"><span class="tb-ico" data-ico="folder" aria-hidden="true"></span><span>作品</span></button>
    <button class="btn tbtn" data-open="about"><span class="tb-ico" data-ico="txt" aria-hidden="true"></span><span>私について</span></button>
    <button class="btn tbtn" data-open="contact"><span class="tb-ico" data-ico="mail" aria-hidden="true"></span><span>お問い合わせ</span></button>
  </span>
  <div id="tabs" class="tabs d-only" aria-label="開いているウィンドウ"></div>
  <div class="tray d-only" id="clock" aria-hidden="true"></div>
</nav>

<p id="live" class="sr-only" aria-live="polite"></p>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
