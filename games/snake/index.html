<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スネーク</title>
<style>
  :root {
    --paper: #f6f1e7;
    --ink: #1d1d1b;
    --red: #e5322d;
    --pink: #ff4fa3;
    --blue: #0a6cff;
    --yellow: #ffd23f;
    --green: #2f5f50;
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 2px solid var(--ink);
    background: var(--paper);
    min-width: 0;
  }
  .bar h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .bar h1 span { color: var(--green); }
  .stats {
    display: flex;
    gap: 14px;
    font-family: var(--mono);
    font-size: 14px;
    white-space: nowrap;
  }
  .stats b { font-weight: 700; }
  .stats .label { font-family: var(--sans); font-size: 11px; letter-spacing: 0.06em; margin-right: 4px; }
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(246, 241, 231, 0.86);
  }
  .overlay[hidden] { display: none; }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    padding: clamp(16px, 4vmin, 28px) clamp(14px, 4vmin, 28px);
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: clamp(26px, 7vmin, 44px);
    font-weight: 900;
    letter-spacing: 0.06em;
    line-height: 1.1;
    text-shadow: 3px 3px 0 var(--pink);
  }
  .card p {
    margin: 0 0 16px;
    font-size: clamp(13px, 2.4vmin, 15px);
    line-height: 1.7;
  }
  .card .score {
    font-family: var(--mono);
    font-size: clamp(30px, 8vmin, 48px);
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .card .sub {
    font-size: 13px;
    margin-bottom: 16px;
  }
  .card .new { color: var(--red); font-weight: 800; }
  .keys {
    font-size: 12px !important;
    color: var(--green);
    margin: 14px 0 0 !important;
  }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    padding: 0 4px;
    background: #fff;
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 0;
    padding: 10px 28px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  button:hover { background: #ffdc66; }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
  @media (max-width: 360px) {
    .bar { padding: 6px 10px; }
    .stats { gap: 10px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>SNAKE<span>.</span></h1>
    <div class="stats" aria-live="off">
      <div><span class="label">スコア</span><b id="score">0</b></div>
      <div><span class="label">ベスト</span><b id="best">0</b></div>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="スネークのゲーム画面"></canvas>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h2>スネーク</h2>
        <p id="howto">矢印キーかWASD(スマホはスワイプ)でヘビを動かし、ドットを食べて長くしよう。壁や自分にぶつかったら終わり。</p>
        <button type="button" id="startBtn">スタート</button>
        <p class="keys"><kbd>Space</kbd> / <kbd>Enter</kbd> でも開始・<kbd>P</kbd> で一時停止</p>
      </div>
    </div>

    <div class="overlay" id="pauseScreen" hidden>
      <div class="card">
        <h2>一時停止</h2>
        <p><kbd>P</kbd> を押すか、下のボタンで再開します。</p>
        <button type="button" id="resumeBtn">再開</button>
      </div>
    </div>

    <div class="overlay" id="overScreen" hidden>
      <div class="card" role="status">
        <h2>ゲームオーバー</h2>
        <div class="score" id="finalScore">0</div>
        <div class="sub" id="finalSub">ベスト 0</div>
        <button type="button" id="restartBtn">もう一度</button>
        <p class="keys"><kbd>Space</kbd> / <kbd>Enter</kbd> でもリスタート</p>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var COLORS = {
    paper: "#f6f1e7", ink: "#1d1d1b", red: "#e5322d", pink: "#ff4fa3",
    blue: "#0a6cff", yellow: "#ffd23f", green: "#2f5f50"
  };
  var FOOD_COLORS = [COLORS.pink, COLORS.blue, COLORS.yellow];
  var BEST_KEY = "portfolio-snake-best";

  var stage = document.getElementById("stage");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var startScreen = document.getElementById("startScreen");
  var pauseScreen = document.getElementById("pauseScreen");
  var overScreen = document.getElementById("overScreen");
  var startBtn = document.getElementById("startBtn");
  var resumeBtn = document.getElementById("resumeBtn");
  var restartBtn = document.getElementById("restartBtn");
  var finalScore = document.getElementById("finalScore");
  var finalSub = document.getElementById("finalSub");

  var reduceMotion = false;
  try {
    var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    reduceMotion = mq.matches;
    var onMq = function (e) { reduceMotion = e.matches; };
    if (mq.addEventListener) mq.addEventListener("change", onMq);
    else if (mq.addListener) mq.addListener(onMq);
  } catch (e) { /* ignore */ }

  function loadBest() {
    try {
      var v = parseInt(window.localStorage.getItem(BEST_KEY), 10);
      return isFinite(v) && v > 0 ? v : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* ignore */ }
  }

  // ---- state ----
  var W = 0, H = 0, dpr = 1;
  var cols = 20, rows = 20, cell = 20, offX = 0, offY = 0;
  var state = "start"; // start | playing | paused | over
  var snake = [], dir = { x: 1, y: 0 }, queue = [];
  var food = null, foodIndex = 0;
  var score = 0, best = loadBest();
  var stepMs = 140, acc = 0, lastT = 0;
  var bursts = [];
  var deadFlash = 0;

  bestEl.textContent = best;

  function computeGrid() {
    // aim for cells of ~22–30px depending on available space
    var target = Math.max(16, Math.min(30, Math.min(W, H) / 16));
    cols = Math.max(10, Math.floor(W / target));
    rows = Math.max(10, Math.floor(H / target));
    layoutGrid();
  }
  function layoutGrid() {
    var pad = 10;
    cell = Math.max(4, Math.floor(Math.min((W - pad * 2) / cols, (H - pad * 2) / rows)));
    offX = Math.floor((W - cell * cols) / 2);
    offY = Math.floor((H - cell * rows) / 2);
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, Math.floor(r.width));
    H = Math.max(1, Math.floor(r.height));
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === "start") { computeGrid(); resetSnake(); } else layoutGrid();
    draw();
  }

  function resetSnake() {
    var cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    queue = [];
  }

  function placeFood() {
    var free = cols * rows - snake.length;
    if (free <= 0) { food = null; return; }
    var occupied = {};
    for (var i = 0; i < snake.length; i++) occupied[snake[i].x + "," + snake[i].y] = true;
    var n = Math.floor(Math.random() * free);
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        if (occupied[x + "," + y]) continue;
        if (n-- === 0) {
          food = { x: x, y: y, color: FOOD_COLORS[foodIndex % FOOD_COLORS.length] };
          foodIndex++;
          return;
        }
      }
    }
  }

  function hideAll() {
    startScreen.hidden = true;
    pauseScreen.hidden = true;
    overScreen.hidden = true;
  }

  function start() {
    if (state === "playing" || state === "paused") return;
    computeGrid();
    resetSnake();
    score = 0;
    foodIndex = 0;
    stepMs = 140;
    acc = 0;
    bursts = [];
    deadFlash = 0;
    scoreEl.textContent = "0";
    placeFood();
    hideAll();
    state = "playing";
    lastT = performance.now();
    try { window.focus(); } catch (e) { /* ignore */ }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function pause() {
    if (state !== "playing") return;
    state = "paused";
    pauseScreen.hidden = false;
  }
  function resume() {
    if (state !== "paused") return;
    pauseScreen.hidden = true;
    state = "playing";
    lastT = performance.now();
    acc = 0;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function gameOver() {
    state = "over";
    deadFlash = 1;
    var isNew = score > best;
    if (isNew) { best = score; saveBest(best); bestEl.textContent = best; }
    finalScore.textContent = score;
    finalSub.innerHTML = isNew && score > 0
      ? '<span class="new">ベスト更新!</span>'
      : "ベスト " + best;
    overScreen.hidden = false;
    restartBtn.focus({ preventScroll: true });
  }

  function turn(nx, ny) {
    if (state !== "playing") return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === nx && last.y === ny) return;
    if (last.x === -nx && last.y === -ny) return;
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = snake[0];
    var nh = { x: head.x + dir.x, y: head.y + dir.y };
    if (nh.x < 0 || nh.y < 0 || nh.x >= cols || nh.y >= rows) { gameOver(); return; }
    var eating = food && nh.x === food.x && nh.y === food.y;
    // the tail moves away this step unless we're eating
    var len = eating ? snake.length : snake.length - 1;
    for (var i = 0; i < len; i++) {
      if (snake[i].x === nh.x && snake[i].y === nh.y) { gameOver(); return; }
    }
    snake.unshift(nh);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      if (score > best) bestEl.textContent = score;
      stepMs = Math.max(62, 140 - score * 2.5);
      if (!reduceMotion) bursts.push({ x: food.x, y: food.y, color: food.color, t: 0 });
      placeFood();
      if (!food) { gameOver(); return; }
    } else {
      snake.pop();
    }
  }

  // ---- drawing ----
  function draw() {
    ctx.fillStyle = COLORS.paper;
    ctx.fillRect(0, 0, W, H);

    var gw = cols * cell, gh = rows * cell;

    // faint grid
    ctx.strokeStyle = "rgba(29,29,27,0.07)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 1; x < cols; x++) {
      var px = offX + x * cell + 0.5;
      ctx.moveTo(px, offY); ctx.lineTo(px, offY + gh);
    }
    for (var y = 1; y < rows; y++) {
      var py = offY + y * cell + 0.5;
      ctx.moveTo(offX, py); ctx.lineTo(offX + gw, py);
    }
    ctx.stroke();

    // border
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = 2;
    ctx.strokeRect(offX - 1, offY - 1, gw + 2, gh + 2);

    // food: a small CMYK-ish dot with a misregistered offset
    if (food && state !== "start") {
      var fx = offX + food.x * cell + cell / 2;
      var fy = offY + food.y * cell + cell / 2;
      var r = cell * 0.32;
      var o = Math.max(1, cell * 0.08);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = food.color === COLORS.yellow ? COLORS.pink : COLORS.yellow;
      ctx.beginPath(); ctx.arc(fx + o, fy + o, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = food.color;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // bursts (decorative)
    for (var b = 0; b < bursts.length; b++) {
      var bu = bursts[b];
      var bx = offX + bu.x * cell + cell / 2;
      var by = offY + bu.y * cell + cell / 2;
      ctx.globalAlpha = Math.max(0, 1 - bu.t);
      ctx.strokeStyle = bu.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(bx, by, cell * (0.4 + bu.t * 1.2), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // snake
    var inset = Math.max(1, Math.round(cell * 0.08));
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var sx = offX + s.x * cell, sy = offY + s.y * cell;
      ctx.fillStyle = (state === "over" && deadFlash > 0 && i === 0) ? COLORS.red : COLORS.ink;
      ctx.fillRect(sx + inset, sy + inset, cell - inset * 2, cell - inset * 2);
      // bridge to the next segment so the body reads as one line
      if (i > 0) {
        var p = snake[i - 1];
        var dx = p.x - s.x, dy = p.y - s.y;
        if (Math.abs(dx) + Math.abs(dy) === 1) {
          ctx.fillRect(
            sx + inset + (dx > 0 ? cell - inset * 2 : dx < 0 ? -inset * 2 : 0),
            sy + inset + (dy > 0 ? cell - inset * 2 : dy < 0 ? -inset * 2 : 0),
            dx !== 0 ? inset * 2 : cell - inset * 2,
            dy !== 0 ? inset * 2 : cell - inset * 2
          );
        }
      }
    }
    // eyes on the head
    if (snake.length) {
      var h = snake[0];
      var hx = offX + h.x * cell + cell / 2, hy = offY + h.y * cell + cell / 2;
      var ex = dir.y !== 0 ? cell * 0.18 : 0, ey = dir.x !== 0 ? cell * 0.18 : 0;
      var fwdx = dir.x * cell * 0.15, fwdy = dir.y * cell * 0.15;
      var er = Math.max(1.5, cell * 0.08);
      ctx.fillStyle = COLORS.paper;
      ctx.beginPath(); ctx.arc(hx + fwdx + ex, hy + fwdy + ey, er, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + fwdx - ex, hy + fwdy - ey, er, 0, Math.PI * 2); ctx.fill();
    }
  }

  function loop(t) {
    var dt = Math.min(250, t - lastT);
    lastT = t;
    if (state === "playing") {
      acc += dt;
      var guard = 0;
      while (acc >= stepMs && state === "playing" && guard++ < 5) {
        acc -= stepMs;
        step();
      }
    }
    if (bursts.length) {
      for (var i = bursts.length - 1; i >= 0; i--) {
        bursts[i].t += dt / 380;
        if (bursts[i].t >= 1) bursts.splice(i, 1);
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- input ----
  var DIRS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };
  var KEY_FALLBACK = { w: "KeyW", s: "KeyS", a: "KeyA", d: "KeyD", W: "KeyW", S: "KeyS", A: "KeyA", D: "KeyD" };

  window.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var code = DIRS[key] ? key : (e.code && DIRS[e.code] ? e.code : KEY_FALLBACK[key]);
    if (code && DIRS[code]) {
      if (key.indexOf("Arrow") === 0) e.preventDefault();
      if (state === "playing") { e.preventDefault(); turn(DIRS[code][0], DIRS[code][1]); }
      return;
    }
    if (key === " " || key === "Spacebar" || key === "Enter") {
      e.preventDefault();
      if (e.repeat) return;
      if (state === "start" || state === "over") start();
      else if (state === "paused") resume();
      return;
    }
    if (key === "p" || key === "P" || e.code === "KeyP") {
      e.preventDefault();
      if (state === "playing") pause();
      else if (state === "paused") resume();
    }
  });

  // swipe support so it's still playable on touch screens
  var swipe = null;
  cv.addEventListener("pointerdown", function (e) {
    try { window.focus(); } catch (err) { /* ignore */ }
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  cv.addEventListener("pointermove", function (e) {
    if (!swipe || e.pointerId !== swipe.id) return;
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    swipe.x = e.clientX; swipe.y = e.clientY;
  });
  function endSwipe() { swipe = null; }
  cv.addEventListener("pointerup", endSwipe);
  cv.addEventListener("pointercancel", endSwipe);

  startBtn.addEventListener("click", start);
  restartBtn.addEventListener("click", start);
  resumeBtn.addEventListener("click", resume);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) pause();
  });
  window.addEventListener("blur", function () { pause(); });

  window.addEventListener("resize", resize);
  if (typeof ResizeObserver === "function") new ResizeObserver(resize).observe(stage);

  resize();
  // 単独で開いたときだけ自動でフォーカス（ポートフォリオに埋め込まれているときは、親ページの「押して操作をはじめる」に任せる）
  if (window.top === window) {
    try { window.focus(); } catch (e) { /* ignore */ }
    startBtn.focus({ preventScroll: true });
  }
  lastT = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
